    sdk: flutter
  nsd: ^5.0.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
